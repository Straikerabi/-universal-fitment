name: "Diagnostic iPhone stacked maker links v1.28.1"
on:
  push:
    branches: ["fix/mobile-maker-links-v1282"]
    paths: ["integrations/mobile-maker-links-diagnose-request.md"]
permissions:
  contents: read
jobs:
  inspect-mobile-markup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore v1.28.1 and print maker link markup/CSS context
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/restore-source-checkpoint.py --target site
          echo "--- THE EXACT TEXT ---"
          rg -n -F 'Weitere Ersatzteile anhand' site/src site/index.html site/styles.css || true
          echo "--- SUPPORT SECTIONS / SOURCES ---"
          rg -n 'Weitere Ersatzteile|Teile mit E-Nr|Ersatzteile.*prüfen|maker.*links|external.*parts|Hersteller.*prüfen' site/src site/styles.css | head -60 || true
          echo "--- DOM NEAR MARKUP ---"
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path("site/src/app.js"),Path("site/styles.css")]:
           text=p.read_text()
           needles=["Weitere Ersatzteile anhand","Teile mit E-Nr","manufacturer-check","manufacturer-parts","brand-link","support-links","external-links"]
           hits=[]
           for n in needles:
            offset=0
            while (i:=text.find(n,offset))>=0:
             hits.append((i,n))
             offset=i+len(n)
           print("\n>>>",p,len(text),"hits",len(hits))
           for i,n in sorted(hits)[:14]:
            print("\nNEEDLE",repr(n),"CHAR",i)
            print(text[max(0,i-1350):i+2300])
          PY
