name: Diagnose 3-way merge of Miele Dyson Hoover against live v1.28.2
on:
  push:
    branches: ["release/models-wave2-v1290"]
    paths: ["integrations/wave2-merge-probe-request.md"]
permissions:
  contents: read
jobs:
  merge-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore current production v1.28.2 source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/restore-source-checkpoint.py --target site
          test "$(node -p "require('./site/package.json').version")" = "1.28.2"
      - name: Restore independent Work baseline and run all three guarded importers
        shell: bash
        run: |
          set -euo pipefail
          for brand in miele dyson hoover; do
            name="work/model-$brand-wave2"
            git fetch --quiet --no-tags origin "refs/heads/$name:refs/heads/$name"
            git worktree add --quiet "$RUNNER_TEMP/$brand" "$name"
            (cd "$RUNNER_TEMP/$brand" &&
             python3 integrations/restore-source-checkpoint.py --target site &&
             test "$(node -p "require('./site/package.json').version")" = "1.28.0")
          done
          (cd "$RUNNER_TEMP/hoover" && npm ci --prefix integrations/auth-sdk --ignore-scripts)
          cp -a "$RUNNER_TEMP/miele/site" "$RUNNER_TEMP/legacy-site-base"
          (cd "$RUNNER_TEMP/miele" && node integrations/import-miele-models-wave2.mjs --target site)
          (cd "$RUNNER_TEMP/dyson" && node integrations/import-dyson-models-wave2.mjs --target site)
          (cd "$RUNNER_TEMP/hoover" && node integrations/import-hoover-models-wave2.mjs --target site)
      - name: Create synthetic git history for the four source branches and classify conflicts
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/site-source-merge"
          mkdir -p "$repo"
          cp -a "$RUNNER_TEMP/legacy-site-base/." "$repo/"
          git -C "$repo" init -q -b old
          git -C "$repo" config user.email "release@example.test"
          git -C "$repo" config user.name "Integration Probe"
          git -C "$repo" add -A
          git -C "$repo" commit -qm "Pinned source v1.28.0"
          for name in miele dyson hoover live; do
            git -C "$repo" switch -qc "$name" old
            if [ "$name" = live ]; then src="$GITHUB_WORKSPACE/site"; else src="$RUNNER_TEMP/$name/site"; fi
            rsync -a --delete --exclude='.git' "$src/" "$repo/"
            git -C "$repo" add -A
            git -C "$repo" commit -qm "Source $name compared to baseline"
            echo "=== $name source delta ==="
            git -C "$repo" diff --stat old..HEAD
          done
          git -C "$repo" switch -q live
          for name in miele dyson hoover; do
            echo "=== MERGE PROBE $name ==="
            if git -C "$repo" merge --no-ff -m "Merge $name model intake" "$name"; then
              echo "CLEAN_MERGE $name"
            else
              echo "CONFLICT_FILES $name"
              git -C "$repo" diff --name-only --diff-filter=U
              git -C "$repo" diff --check || true
              for file in $(git -C "$repo" diff --name-only --diff-filter=U); do
                echo "--- $file conflict context ---"
                grep -n -C 3 '^<<<<<<<\\|^=======\\|^>>>>>>>' "$repo/$file" | head -110 || true
              done
              python3 integrations/resolve-wave2-merge-v1290.py "$repo" "$name"
              git -C "$repo" commit -qm "Resolve verified $name brand source edits before full tests"
            fi
          done
          rsync -a --delete --exclude='.git' "$repo/" "$GITHUB_WORKSPACE/site/"
          echo "=== VERIFIED MERGED SOURCE INVENTORY ==="
          (cd "$GITHUB_WORKSPACE/site" && node --check src/core/typeplate.js && node --check src/data/new-brands-index.js && node --check src/data/brand-index.js)
          echo "=== MODEL EVIDENCE MATERIALIZED ==="
          grep -n "modelCount" "$GITHUB_WORKSPACE/site/src/data/new-brands-index.js" | cut -c1-200
          npm ci --prefix integrations/auth-sdk --ignore-scripts
          node integrations/build-app.mjs
          (cd site && npm test && npm run check)
