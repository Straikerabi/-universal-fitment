name: "One-time package Samsung v1.26.9"
on:
  push:
    branches: ["work/samsung-import-v1-26-9"]
    paths: ["integrations/samsung-package-request.md"]
permissions:
  contents: write
jobs:
  package-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare immutable v1.26.8 baseline and bump source version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline
          cp -a site baseline/site
          for file in src/data/samsung-pack.js src/data/new-brands-index.js tests/catalog-v126.test.mjs tests/catalog-seven-brands.test.mjs tests/vorwerk-expansion.test.mjs; do
            git show "e2fe474d5ca724d14225ccf9a089e56c94a81410:site/$file" > "baseline/site/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("site")
          excluded=("app-v","catalog-","services-v")
          edited=[]
          for p in root.rglob("*"):
              if not p.is_file() or p.name.startswith(excluded) or "node_modules" in p.parts:
                  continue
              if p.suffix not in {".js",".mjs",".json",".html",".css",".webmanifest"}:
                  continue
              value=p.read_text()
              if "26" in value:
                  for backslashes in range(1,5):
                      escaped="\\"*backslashes
                      value=value.replace("1"+escaped+".26"+escaped+".8","1"+escaped+".26"+escaped+".9")
                  p.write_text(value.replace("1.26.8","1.26.9"))
                  edited.append(str(p))
          assert json.loads((root/"package.json").read_text())["version"]=="1.26.9"
          assert "APP_VERSION = '1.26.9'" in (root/"src/app.js").read_text()
          assert "app-v1.26.9.js" in (root/"index.html").read_text()
          assert "app-v1.26.9.js" in (root/"sw.js").read_text()
          print("Updated files:", edited)
          PY
      - name: Compile, sync actual Samsung pack bytes, and test the app
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix integrations/auth-sdk --ignore-scripts
          node integrations/build-app.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          part_file=Path("site/catalog-samsung-v1.26.9.js")
          assert part_file.exists()
          bytes=part_file.stat().st_size
          index=Path("site/src/data/new-brands-index.js")
          source=index.read_text()
          assert source.count('"packBytes":104223')==1, "Unexpected Samsung pack bytes"
          index.write_text(source.replace('"packBytes":104223',f'"packBytes":{bytes}',1))
          print("Exact compiled Samsung pack byte size:",bytes)
          PY
          node integrations/build-app.mjs
          node integrations/build-app.mjs --check
          (cd site && npm test && npm run check)
      - name: Package reproducible delta, check source checkpoint and retain release documents
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/package-site-patch.py --baseline baseline/site --site site --version 1.26.9 --description "Samsung exact model accessories and fitment"
          python3 integrations/create-source-checkpoint.py --site site
          python3 integrations/restore-source-checkpoint.py --target /tmp/samsung-v1269-restored
          python3 - <<'PY'
          from pathlib import Path
          import json
          meta=json.loads(Path("integrations/source-checkpoint.json").read_text())
          assert meta["version"]=="1.26.9"
          report={
            "version":"1.26.9",
            "source_checked_date":"2026-10-08",
            "model_count_total":870,
            "record_count_total":881,
            "catalog_articles_total":1928,
            "physical_articles_total":1810,
            "target_slots_occupied":657,
            "records_without_parts":246,
            "samsung_models":66,
            "samsung_articles":34,
            "samsung_models_with_parts":9,
            "samsung_models_without_parts":57,
            "new_model_references":2,
            "new_distinct_article_codes":7,
            "new_optional_accessory_relationships":50,
            "app_test_groups":36,
            "validation":["byte-identical source bundle","app unit tests","app syntax","SHA-verified and replayed patch","SHA-verified source checkpoint"],
            "external_live_offer_check":"not_performed",
            "physical_fitment_check":"not_performed"
          }
          Path("integrations/samsung-release-v1269.json").write_text(json.dumps(report,indent=2)+"\n")
          changelog=Path("CHANGELOG.md")
          changelog.write_text(changelog.read_text().replace("# Universal Fitment — Patchnotes / patch notes\n","# Universal Fitment — Patchnotes / patch notes\n\n## v1.26.9 — 8. Oktober 2026\n\n- **DE:** Sechs Samsung-Modellen wurden 50 quellenbelegte optionale Zubehörbeziehungen zugeordnet. Zwei neue Jet-85S-/95S-Modelle und sieben zuvor fehlende Artikelkennungen wurden ergänzt: 66 Samsung-Modelle, 34 Teile, neun mit Hersteller-Zubehörliste.\n- **DE:** Herstellernennungen bestätigen nicht automatisch die Passform; Wischaufsatz-/Clean-Station-Bedingungen, unterschiedliche Suffixe und unbekannte Preise bleiben sichtbar.\n- **EN:** Six Samsung models gain 50 source-listed optional accessory relationships, including two new Jet 85S/95S models and seven new distinct accessory codes. No automatic fitment or live price claim.\n\n",1))
          readme=Path("README.md")
          doc=readme.read_text().replace("# Universal Fitment v1.26.8","# Universal Fitment v1.26.9")
          for a,b in [("868 Modellbezeichnungen in 879","870 Modellbezeichnungen in 881"),("1.921 unterschiedliche Katalogartikel","1.928 unterschiedliche Katalogartikel"),("**1.803**","**1.810**"),("655 von 1.000","657 von 1.000"),("| Samsung | 64 | 64 | 27 | 0 | 61 |","| Samsung | 66 | 66 | 34 | 0 | 57 |"),("250 Modelleinträge","246 Modelleinträge"),("mindestens 73 weitere Samsung-","mindestens 66 weitere Samsung-")]:
              assert a in doc, f"README anchor changed: {a}"
              doc=doc.replace(a,b)
          readme.write_text(doc)
          Path("integrations/samsung-import-v1269.md").write_text(
              "# Samsung v1.26.9 — exakte Hersteller-Zubehörlisten\n\n"
              "Sechs Samsung-Modelle besitzen 50 explizite Zubehörbeziehungen aus ihren deutschen Produktseiten. "
              "Vier Modelle waren bereits im Katalog; zwei Jet-85S-/95S-Geräte wurden zusätzlich aufgenommen. "
              "Sieben wirklich neue Zubehörkennungen, darunter VCA-SHFF80T/C, VCA-SBTD95, VCA-SAPF80/WA, "
              "VCA-WBC652/GL, VCA-ADB90 und VCA-SPW95, sind hinzugekommen.\n\n"
              "Ausführungskennungen werden nicht stillschweigend vereinheitlicht. Keine Annahmen über aktuelle Preise, "
              "Lagerbestände, automatische technische Passung oder die Verfügbarkeit der einzelnen Zubehörartikel. "
              "Wischtücher erfordern ihren passenden Wischaufsatz, Clean-Station-Beutel die entsprechende Station.\n\n"
              "Exakte Modellquellen und alle Kennungen: integrations/samsung-accessory-evidence-2026-10-08.json. "
              "Die 36 App-Testgruppen, Syntaxprüfung, reproduzierbare Browserpakete, Patch-Replay und "
              "SHA-256-Wiederherstellung der neuen Quellenfassung wurden im vorbereitenden GitHub-Job durchgeführt; "
              "der produktive GitHub-Pages-Build wird separat verifiziert.\n")
          PY
      - name: Commit only release deltas and sources, not temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -qr --cached site
          rm -rf site baseline
          git rm -f .github/workflows/samsung-source-workspace.yml .github/workflows/samsung-package.yml integrations/samsung-workspace-request.md integrations/samsung-package-request.md
          git add -A
          git add -f .demo/v1.26.9-patch/part-* .demo/source-v1.26.9/part-*
          git commit -m "Release-ready v1.26.9 Samsung optional accessories and verified package"
          git push origin HEAD:work/samsung-import-v1-26-9
