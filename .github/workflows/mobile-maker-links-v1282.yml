name: "Verify mobile maker links no overlap v1.28.2"
on:
  push:
    branches: ["fix/mobile-maker-links-v1282"]
    paths: ["integrations/mobile-maker-links-build-request.md"]
permissions:
  contents: write
jobs:
  source-mobile-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore current verified sources, dependencies and original app
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/restore-source-checkpoint.py --target site
          test "$(node -p "require('./site/package.json').version")" = "1.28.1"
          npm ci --prefix integrations/auth-sdk --ignore-scripts
          node integrations/build-app.mjs
      - name: Apply isolated mobile manufacturer links fix, preserve all seven targets
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/package-mobile-maker-links-v1282.py prepare
          node integrations/fix-mobile-maker-links-v1282.mjs
          node integrations/test-mobile-maker-links-v1282.mjs
          node --check integrations/test-mobile-maker-links-browser-v1282.mjs
      - name: Build v1.28.2 and run complete application/syntax regression
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/package-mobile-maker-links-v1282.py bump
          node integrations/build-app.mjs
          node integrations/build-app.mjs --check
          (cd site && npm test && npm run check)
          node integrations/test-mobile-maker-links-v1282.mjs
      - name: Install headless Chromium in independent QA environment
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --no-save --prefix /tmp/uf-maker-browser playwright@1.56.1
          /tmp/uf-maker-browser/node_modules/.bin/playwright install chromium
      - name: Verify seven real rendered manufacturer buttons at seven viewport widths
        shell: bash
        env:
          UF_PLAYWRIGHT_MODULE: file:///tmp/uf-maker-browser/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          node integrations/test-mobile-maker-links-browser-v1282.mjs
      - name: Prove exact release delta replay and reconstruct source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/package-site-patch.py --baseline baseline/site --site site --version 1.28.2 --description "Fix seven overlapping manufacturer spare links on narrow iPhone viewports"
          python3 integrations/create-source-checkpoint.py --site site
          python3 integrations/restore-source-checkpoint.py --target /tmp/mobile-maker-v1282-source
          python3 integrations/package-mobile-maker-links-v1282.py finish
          cat publish-info-v1.28.2.json
      - name: Commit checksum-controlled archives and docs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md integrations/source-checkpoint.json integrations/mobile-maker-links-release-v1282.json
          git add -f .demo/v1.28.2-patch/part-* .demo/source-v1.28.2/part-*
          if git diff --cached --name-only | grep -E '^site/|^\.github/workflows/'; then
            echo "Refusing to commit unpacked app or temp workflow"; exit 1
          fi
          git commit -m "Package mobile maker links layout fix and verified v1.28.2 release"
          git push origin HEAD:fix/mobile-maker-links-v1282
