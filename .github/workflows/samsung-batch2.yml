name: "One-time Samsung batch 2 v1.26.10"
on:
  push:
    branches: ["work/samsung-batch2-v1-26-10"]
    paths: ["integrations/samsung-batch2-request.md"]
permissions:
  contents: write
jobs:
  prepare-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct 1.26.9 site with released SHA-verified patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path(".github/workflows/pages.yml").read_text().splitlines()
          steps=0
          for i,line in enumerate(lines):
              if not line.startswith("      - name: "):
                  continue
              name=line.partition("      - name: ")[2].strip().strip('"')
              if not (name.startswith("Rebuild ") or name.startswith("Apply ")):
                  continue
              j=i+1
              while j<len(lines) and not lines[j].startswith("      - name: "):
                  if lines[j]=="        run: |":
                      cmds=[]
                      for command in lines[j+1:]:
                          if not command.startswith("          "): break
                          cmds.append(command[10:])
                      subprocess.run(["bash","-e","-o","pipefail","-c","\n".join(cmds)],check=True)
                      steps+=1
                      break
                  j+=1
          assert steps>=38, f"Fewer historical release steps than expected: {steps}"
          assert (Path("site")/"package.json").exists()
          print(f"Reconstructed site from {steps} immutable historical steps")
          PY
      - name: Apply source evidence and bump v1.26.10
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/make-samsung-release-v12610.py prepare
          node integrations/apply-samsung-batch2.mjs
      - name: Build app, verify catalogue counts and run all existing tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix integrations/auth-sdk --ignore-scripts
          node integrations/build-app.mjs
          python3 integrations/make-samsung-release-v12610.py sync
          node integrations/build-app.mjs
          node integrations/build-app.mjs --check
          (cd site && npm test && npm run check)
      - name: Create checksum-verified release patch and source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/package-site-patch.py --baseline baseline/site --site site --version 1.26.10 --description "Samsung four exact optional accessory lists"
          python3 integrations/create-source-checkpoint.py --site site
          python3 integrations/restore-source-checkpoint.py --target /tmp/uf-source-v12610-validated
          python3 integrations/make-samsung-release-v12610.py finish
          cat publish-info-v1.26.10.json
          cat integrations/samsung-release-v12610.json
      - name: Commit release materials without generated working site or workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md integrations/source-checkpoint.json integrations/samsung-release-v12610.json
          git add -f .demo/v1.26.10-patch/part-* .demo/source-v1.26.10/part-*
          if git diff --cached --name-only | grep -E '^site/|^\.github/workflows/'; then
            echo "Unexpected app source or workflow staged"; exit 1
          fi
          git diff --cached --name-only | tail -8
          git commit -m "Prepare tested v1.26.10 Samsung accessory relations and release checkpoint"
          git push origin HEAD:work/samsung-batch2-v1-26-10
