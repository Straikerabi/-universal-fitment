name: "Samsung v1.26.11 one-time release"
on:
  push:
    branches: ["work/samsung-v12611-accessories"]
    paths: ["integrations/samsung-v12611-request.md"]
permissions:
  contents: write
jobs:
  package-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore SHA-verified v1.26.10 source
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/restore-source-checkpoint.py --target site
          test "$(node -p "require('./site/package.json').version")" = "1.26.10"
      - name: Build previous version for delta baseline and prepare new source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix integrations/auth-sdk --ignore-scripts
          node integrations/build-app.mjs
          python3 integrations/make-samsung-v12611.py prepare
          node integrations/apply-samsung-v12611.mjs
      - name: Build v1.26.11 and run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          node integrations/build-app.mjs
          python3 integrations/make-samsung-v12611.py sync
          node integrations/build-app.mjs
          node integrations/build-app.mjs --check
          (cd site && npm test && npm run check)
      - name: Verify deterministic patch and source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/package-site-patch.py --baseline baseline/site --site site --version 1.26.11 --description "Samsung original accessory fitments and brush"
          python3 integrations/create-source-checkpoint.py --site site
          python3 integrations/restore-source-checkpoint.py --target /tmp/samsung-v12611-check
          python3 integrations/make-samsung-v12611.py finish
          cat publish-info-v1.26.11.json
      - name: Commit only release archives and documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md integrations/source-checkpoint.json integrations/samsung-release-v12611.json
          git add -f .demo/v1.26.11-patch/part-* .demo/source-v1.26.11/part-*
          if git diff --cached --name-only | grep -E '^site/|^\.github/workflows/'; then
            echo "Unexpected source files or workflow changes staged"
            exit 1
          fi
          git commit -m "Prepare verified Samsung v1.26.11 release archive and source checkpoint"
          git push origin HEAD:work/samsung-v12611-accessories
