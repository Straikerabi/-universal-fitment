name: Deploy v1.15 pilot readiness to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild v0.7 base
        shell: bash
        run: |
          cat .demo/v0.7/part-* > demo-v0.7.zip
          echo "c02466e0c2a55cbdce895fae64bf1359b725bd09de4a9de69b483bb2b090078e  demo-v0.7.zip" | sha256sum -c -
          mkdir -p build
          unzip -q demo-v0.7.zip -d build
          mv build/universal-fitment-demo-v0.7 site

      - name: Apply v0.8 patch
        shell: bash
        run: |
          base64 -d .demo/v0.8-patch/update.patch.gz.b64 | gzip -d > update-v0.8.patch
          echo "d3f355b83087464fef338635177166f483fa75b8f89b0c004fec3566a7252ba7  update-v0.8.patch" | sha256sum -c -
          patch -p2 -d site < update-v0.8.patch

      - name: Apply v0.9 patch
        shell: bash
        run: |
          cat .demo/v0.9-patch/part-* | base64 -d | gzip -d > update-v0.9.patch
          echo "2303c23b9d83e4cc7564c48f432b6c69fb21785e20dbb3faf4afcf199e87c01f  update-v0.9.patch" | sha256sum -c -
          patch -p1 -d site < update-v0.9.patch

      - name: Apply v1.0 real-data patch
        shell: bash
        run: |
          cat .demo/v1.0-patch/part-* | base64 -d | gzip -d > update-v1.0.patch
          echo "edb5a97b5d2be13cc359f049122d8ba4b5782fbb74a1faa82dae813141ce8b31  update-v1.0.patch" | sha256sum -c -
          patch -p2 -d site < update-v1.0.patch

      - name: Apply v1.1 coffee live-data patch
        shell: bash
        run: |
          cat .demo/v1.1-patch/part-* | base64 -d | gzip -d > update-v1.1.patch
          echo "60d05e22d55ad4c56a453e44b3afda5edc23b3d04fdde5c79d9d5005c429f462  update-v1.1.patch" | sha256sum -c -
          patch -p1 -d site < update-v1.1.patch

      - name: Apply v1.2 identifier-guidance patch
        shell: bash
        run: |
          cat .demo/v1.2-patch/part-* | base64 -d | gzip -d > update-v1.2.patch
          echo "81704c1fd138b05cf8511cda27580f4bda0c0de13cdfad926f99dab7a5c90b06  update-v1.2.patch" | sha256sum -c -
          patch -p1 -d site < update-v1.2.patch

      - name: Apply v1.3 OCR blind-test patch
        shell: bash
        run: |
          cat .demo/v1.3-patch/part-* | base64 -d | gzip -d > update-v1.3.patch
          echo "712dffd0bff704b8afcf6a48ae166f604bd38d8359fb7910e1318495717f6e6d  update-v1.3.patch" | sha256sum -c -
          patch -p1 -d site < update-v1.3.patch

      - name: Apply v1.6 BUILD NOW patch
        shell: bash
        run: |
          cat .demo/v1.6-patch/part-* | base64 -d | gzip -d > update-v1.6.patch
          echo "229ae9440f4b399e9a15777b4e75baa2b5c9e63ac7095fe44f52d7fa56f36c9f  update-v1.6.patch" | sha256sum -c -
          patch -p1 -d site < update-v1.6.patch

      - name: Apply v1.7 Miele pilot patch
        shell: bash
        run: |
          cat .demo/v1.7-patch/part-* | base64 -d | gzip -d > update-v1.7.patch
          echo "a1060c3d92add6113d6d77a3dc9ec2c2f593968f944240bc1e501d63aa84c8c2  update-v1.7.patch" | sha256sum -c -
          patch -p4 -d site < update-v1.7.patch

      - name: Apply v1.8 concrete Miele catalog patch
        shell: bash
        run: |
          cat .demo/v1.8-patch/part-* | base64 -d | gzip -d > update-v1.8.patch
          echo "218433b58e66c104e6396ee4624cfeb8bc15cb1b644d11fefdee2570de61e4c4  update-v1.8.patch" | sha256sum -c -
          patch -p1 -d site < update-v1.8.patch

      - name: Apply v1.9 Miele spare-parts patch
        shell: bash
        run: |
          cat .demo/v1.9-patch/part-* | base64 -d | gzip -d > update-v1.9.patch
          echo "7d81aad8e2d2eff7f379f950bf15dd5226d6b9f4d8e86e74d73a8ebcbc943569  update-v1.9.patch" | sha256sum -c -
          patch -p1 -d site < update-v1.9.patch

      - name: Apply v1.10 prices, shipping and installation-time patch
        shell: bash
        run: |
          cat .demo/v1.10-patch/part-* | base64 -d | gzip -d > update-v1.10.patch
          echo "8f7e5d2f5d3c3dc8e25874e97322cb9e599089e3f7f1c5ebe31999d64b5b8a0c  update-v1.10.patch" | sha256sum -c -
          patch -p1 -d site < update-v1.10.patch

      - name: Apply v1.11 used-parts and marketplace-search patch
        shell: bash
        run: |
          cat .demo/v1.11-patch/part-* | base64 -d | gzip -d > update-v1.11.patch
          echo "7e44c824deee688b2a07b5dbd32764d10e5f7640f70b33626accb6bce457d1d1  update-v1.11.patch" | sha256sum -c -
          patch -p1 -d site < update-v1.11.patch

      - name: Apply v1.12 cart-to-merchant handoff patch
        shell: bash
        run: |
          cat .demo/v1.12-patch/part-* | base64 -d | gzip -d > update-v1.12.patch
          echo "f1911ece8369a9cbcb5b3b1de66f8985228b0eb1c263f2af5d0e5d84afa936a3  update-v1.12.patch" | sha256sum -c -
          patch -p1 -d site < update-v1.12.patch

      - name: Apply v1.13 pilot authentication patch
        shell: bash
        run: |
          cat .demo/v1.13-patch/part-* | base64 -d | gzip -d > update-v1.13.patch
          echo "d5de1d4803d4b5ba65d52ee57dfe264ca9f6b270a6c4361e081788c61c39f53a  update-v1.13.patch" | sha256sum -c -
          patch -p1 -d site < update-v1.13.patch

      - name: Apply v1.14 guest reliability patch
        shell: bash
        run: |
          cat .demo/v1.14-patch/part-* | base64 -d | gzip -d > update-v1.14.patch
          echo "ec71cbf9c62391872c8b9a52d813b12092eedf91ac45813e5f3a58080e973822  update-v1.14.patch" | sha256sum -c -
          patch -p1 -d site < update-v1.14.patch

      - name: Apply v1.15 pilot readiness patch
        shell: bash
        run: |
          cat .demo/v1.15-patch/part-* | base64 -d | gzip -d > update-v1.15.patch
          echo "e8872d05ee7d791df416805b37d576b725f136808bc95e31befd92dc4599369a  update-v1.15.patch" | sha256sum -c -
          patch -p1 -d site < update-v1.15.patch

      - name: Verify reproducible app bundle
        run: |
          npm ci --prefix integrations/auth-sdk --ignore-scripts
          node integrations/build-app.mjs --check

      - name: Run checks
        working-directory: site
        run: |
          npm test
          npm run check

      - name: Check server provider contracts
        run: |
          node --check integrations/marketplace-providers.mjs
          node integrations/marketplace-providers.test.mjs
          node --check integrations/marketplace-handler.mjs
          node integrations/marketplace-handler.test.mjs
          node integrations/marketplace-access.test.mjs
          node integrations/marketplace-quota.test.mjs
          node integrations/marketplace-pilot.test.mjs
          node integrations/build-edge.mjs
          node integrations/edge-smoke.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-and-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
