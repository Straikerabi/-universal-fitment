name: "One-time Samsung model-first v1.27.1 verification"
on:
  push:
    branches: ["work/samsung-models-v1271"]
    paths: ["integrations/samsung-v1271-request.md"]
permissions:
  contents: write
jobs:
  checked-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore SHA checked v1.27.0 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/restore-source-checkpoint.py --target site
          test "$(node -p "require('./site/package.json').version")" = "1.27.0"
      - name: Build old bundle, preserve baseline, import exact Samsung models
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix integrations/auth-sdk --ignore-scripts
          node integrations/build-app.mjs
          python3 integrations/package-samsung-models-v1271.py prepare
          node integrations/import-samsung-models-v1271.mjs
      - name: Run full app regression and verify new browser bundles
        shell: bash
        run: |
          set -euo pipefail
          node integrations/build-app.mjs
          python3 integrations/package-samsung-models-v1271.py sync
          node integrations/build-app.mjs
          node integrations/build-app.mjs --check
          (cd site && npm test && npm run check)
      - name: Verify release delta patch and restored source checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/package-site-patch.py --baseline baseline/site --site site --version 1.27.1 --description "Samsung two manufacturer-verified model-only references"
          python3 integrations/create-source-checkpoint.py --site site
          python3 integrations/restore-source-checkpoint.py --target /tmp/uf-v1271-restore
          python3 integrations/package-samsung-models-v1271.py finish
          cat publish-info-v1.27.1.json
      - name: Commit release only, excluding temporary source and workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md integrations/source-checkpoint.json integrations/samsung-model-release-v1271.json integrations/model-first-plan-v1270.md
          git add -f .demo/v1.27.1-patch/part-* .demo/source-v1.27.1/part-*
          if git diff --cached --name-only | grep -E '^site/|^\.github/workflows/'; then
            echo "Unintended workflow or unpacked local source staged"; exit 1
          fi
          git commit -m "Prepare verified Samsung model-only v1.27.1 release"
          git push origin HEAD:work/samsung-models-v1271
