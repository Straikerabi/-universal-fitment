name: Wave5 private unified Consumer + evidence QA (no deployment)

on:
  push:
    branches:
      - integration/private-unified-preview-wave5-owner
  pull_request:
    branches:
      - integration/private-unified-preview-wave4
    paths:
      - 'integrations/consumer-repair-mission-poc/**'
      - 'integrations/real-fitment-review-owner/**'
      - '.github/workflows/wave5-private-unified.yml'

permissions:
  contents: read

jobs:
  private-wave5-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out read-only private staging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source evidence and catalogue identity review
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/verified-repair-cases-wave4/validate.py
          python3 integrations/verified-repair-cases-wave4/report.py --check
          python3 -m unittest discover -s integrations/verified-repair-cases-wave4 -p 'test_*.py' -v
          node --test integrations/consumer-repair-mission-poc/tests/wave3-readiness-audit.test.mjs
          node --test integrations/real-fitment-review-owner/review.test.mjs
          node integrations/real-fitment-review-owner/review.mjs --json > "$RUNNER_TEMP/uf-real-review.json"
          node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync(process.argv[1]));if(c.counts.manufacturerListedPartAssociations!==18||c.counts.positivelyInstallationApproved!==0)process.exit(1);console.log(c.counts)" "$RUNNER_TEMP/uf-real-review.json"
      - name: Consumer + single shared v1 engine + offline guards
        shell: bash
        run: |
          set -euo pipefail
          npm test --prefix integrations/consumer-repair-mission-poc
          node --test integrations/fitment-engine-v1-poc/contract.test.mjs integrations/dual-platform-owner-review/bridge.test.mjs
          npm run offline:check --prefix integrations/consumer-repair-mission-poc
          node --check integrations/consumer-repair-mission-poc/app.mjs
          node --check integrations/consumer-repair-mission-poc/mission-state.mjs
          node --check integrations/consumer-repair-mission-poc/wave3-readiness-audit.mjs
      - name: Pinned, isolated Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/uf-wave5-pw" --no-save playwright@1.62.1
          node "$RUNNER_TEMP/uf-wave5-pw/node_modules/playwright/cli.js" install chromium
      - name: Full local responsive/offline/repair-passport browser regression
        shell: bash
        run: |
          set -euo pipefail
          export UF_PLAYWRIGHT_MODULE="$RUNNER_TEMP/uf-wave5-pw/node_modules/playwright/index.mjs"
          npm run test:browser --prefix integrations/consumer-repair-mission-poc
          node integrations/consumer-repair-mission-poc/tests/passport-browser.mjs
      - name: Confirm no site directory, no release operation
        run: |
          set -euo pipefail
          test ! -e site
          git status --porcelain
