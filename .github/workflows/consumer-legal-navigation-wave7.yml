name: Private legal navigation QA (NO legal release or deploy)
on:
  pull_request:
    branches: [integration/private-unified-preview-wave5-owner]
    paths:
      - 'integrations/consumer-legal-navigation-wave7/**'
      - '.github/workflows/consumer-legal-navigation-wave7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies (no scripts)
        run: npm ci --ignore-scripts --prefix integrations/consumer-legal-navigation-wave7
      - name: Install Chromium test runtime
        working-directory: integrations/consumer-legal-navigation-wave7
        run: npx playwright install --with-deps chromium
      - name: Unit, source and offline fingerprint tests
        run: |
          npm test --prefix integrations/consumer-legal-navigation-wave7
          npm run offline:check --prefix integrations/consumer-legal-navigation-wave7
      - name: Full mobile, keyboard, dark and offline browser matrix (no skips)
        run: npm run test:browser --prefix integrations/consumer-legal-navigation-wave7
      - name: Existing consumer and unchanged launch-gate regression tests
        run: |
          npm test --prefix integrations/consumer-repair-mission-poc
          python3 -m unittest discover -s integrations/consumer-launch-preflight-wave6 -v
      - name: Explicitly prove launch remains BLOCKED
        shell: bash
        run: |
          set +e
          python3 integrations/consumer-launch-preflight-wave6/preflight.py
          gate_status=$?
          set -e
          test "$gate_status" -eq 2
      - name: Private synthetic QA diagnostics, not a website
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-legal-navigation-qa
          path: integrations/consumer-legal-navigation-wave7/qa/
          if-no-files-found: warn
          retention-days: 7
