name: "One-time build Samsung Bespoke Jet AI v1.26.12"
on:
  push:
    branches: ["work/samsung-v12612-jet-ai"]
    paths: ["integrations/samsung-v12612-request.md"]
permissions:
  contents: write
jobs:
  package-samsung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore source checkpoint v1.26.11
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/restore-source-checkpoint.py --target site
          test "$(node -p "require('./site/package.json').version")" = "1.26.11"
      - name: Generate reproducible previous version and apply reviewed evidence
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix integrations/auth-sdk --ignore-scripts
          node integrations/build-app.mjs
          python3 integrations/make-samsung-v12612.py prepare
          node integrations/apply-samsung-v12612.mjs
      - name: Test new source, rebuild and verify browser assets
        shell: bash
        run: |
          set -euo pipefail
          node integrations/build-app.mjs
          python3 integrations/make-samsung-v12612.py sync
          node integrations/build-app.mjs
          node integrations/build-app.mjs --check
          (cd site && npm test && npm run check)
      - name: Verify checksummed release archive and source restoration
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/package-site-patch.py --baseline baseline/site --site site --version 1.26.12 --description "Bespoke Jet AI model and exact optional accessories"
          python3 integrations/create-source-checkpoint.py --site site
          python3 integrations/restore-source-checkpoint.py --target /tmp/uf-v12612-restore-check
          python3 integrations/make-samsung-v12612.py finish
          cat publish-info-v1.26.12.json
      - name: Publish tested source and patch archives on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md integrations/source-checkpoint.json integrations/samsung-release-v12612.json
          git add -f .demo/v1.26.12-patch/part-* .demo/source-v1.26.12/part-*
          if git diff --cached --name-only | grep -E '^site/|^\.github/workflows/'; then
            echo "Unexpected tracked local source/workflow in release staging"
            exit 1
          fi
          git commit -m "Package tested Samsung v1.26.12 Bespoke Jet AI source and release patch"
          git push origin HEAD:work/samsung-v12612-jet-ai
