name: Owner Consumer live catalogue labels and offline integrity (private)
on:
  push:
    branches: [integration/consumer-catalog-live-count-owner]
    paths:
      - 'integrations/consumer-repair-mission-poc/app.mjs'
      - '.github/workflows/owner-consumer-live-catalog.yml'
permissions:
  contents: write
jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact owner branch and current app syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = integration/consumer-catalog-live-count-owner
          node --check integrations/consumer-repair-mission-poc/app.mjs
      - name: Rebuild worker and offline fingerprints from actual current bytes, never by copying another worker branch
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {configSource,workerSource} from './integrations/consumer-repair-mission-poc/prepare-offline.mjs';
          fs.writeFileSync('integrations/consumer-repair-mission-poc/offline-config.mjs', configSource());
          fs.writeFileSync('integrations/consumer-repair-mission-poc/offline-worker.mjs', workerSource());
          NODE
          node integrations/consumer-repair-mission-poc/prepare-offline.mjs --check
      - name: Execute complete local Consumer and data regression against regenerated files
        shell: bash
        run: |
          set -euo pipefail
          node --test integrations/consumer-repair-mission-poc/tests/*.test.mjs
          node --test integrations/private-owner-wave5/catalog-scorecard.test.mjs
          git diff --check
      - name: Commit generated fingerprints ONLY to this isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- integrations/consumer-repair-mission-poc/offline-config.mjs integrations/consumer-repair-mission-poc/offline-worker.mjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(consumer): regenerate pinned cache after dynamic catalog labels [skip ci]"
            git push origin HEAD:refs/heads/integration/consumer-catalog-live-count-owner
          fi
      - name: Print explicit gate state
        shell: bash
        run: |
          echo "Live catalogue counts now derived from actual loaded snapshot."
          echo "No OEM source or legal/installation approval has been upgraded."
          echo "Owner legal Source-Lock needs separate hash review after the code change."
          echo "No main merge, no public deployment."
