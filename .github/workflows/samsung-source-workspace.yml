name: "Temporary Samsung source workspace"
on:
  push:
    branches: ["work/samsung-import-v1-26-9"]
    paths: ["integrations/samsung-workspace-request.md"]
permissions:
  contents: write
jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore checked source and expose files on work branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          lines = Path(".github/workflows/pages.yml").read_text().splitlines()
          count = 0
          for i, line in enumerate(lines):
              if not line.startswith("      - name: "):
                  continue
              title = line.split("- name: ", 1)[1].strip().strip('"')
              if not (title.startswith("Rebuild ") or title.startswith("Apply ")):
                  continue
              j = i + 1
              while j < len(lines) and not lines[j].startswith("      - name: "):
                  if lines[j] == "        run: |":
                      commands = []
                      for command in lines[j+1:]:
                          if not command.startswith("          "):
                              break
                          commands.append(command[10:])
                      subprocess.run(["bash", "-e", "-o", "pipefail", "-c", "\n".join(commands)], check=True)
                      count += 1
                      break
                  j += 1
          assert count >= 35, f"Expected all historical patch rebuilds; got {count}"
          assert (Path("site") / "src" / "app.js").exists()
          print(f"Reconstructed site from {count} version-pinned CI steps")
          PY
          echo "Available Samsung source modules:"
          find site/src -type f -iname '*samsung*' -print
          echo "Source checkpoint prepared."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site
          git commit -m "Temporary source workspace for Samsung catalog v1.26.9"
          git push origin HEAD:work/samsung-import-v1-26-9
