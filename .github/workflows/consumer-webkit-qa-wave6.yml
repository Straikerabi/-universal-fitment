name: Consumer mobile WebKit + Chromium gate (private simulation, no deployment)

on:
  pull_request:
    branches: [integration/private-unified-preview-wave5-owner]
    paths:
      - 'integrations/consumer-webkit-qa-wave6/**'
      - 'integrations/consumer-repair-mission-poc/**'
      - 'integrations/fitment-engine-v1-poc/**'
      - 'integrations/dual-platform-owner-review/**'
      - 'integrations/business-embed-poc/adapter.mjs'
      - '.github/workflows/consumer-webkit-qa-wave6.yml'

permissions:
  contents: read

jobs:
  mobile-browser-gate:
    # Work-B proof is deliberately sealed to its original #81 branch.
    # Other private Consumer PRs are fully exercised by owner-consumer-browser-integration.yml.
    if: github.event.pull_request.head.ref == 'work/wave6-consumer-webkit-qa'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout the exact PR head, not a parallel catalog merge preview
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install only isolated, locked test dependencies
        id: deps
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix integrations/consumer-webkit-qa-wave6
      - name: Guard unchanged catalog/app/core and validate fail-closed reporter
        id: scope
        run: |
          set -euo pipefail
          npm test --prefix integrations/consumer-webkit-qa-wave6
          npm run check --prefix integrations/consumer-webkit-qa-wave6
          npm test --prefix integrations/consumer-repair-mission-poc
          npm run offline:check --prefix integrations/consumer-repair-mission-poc
      - name: Install the two pinned browser bundles and Ubuntu runtime dependencies
        id: browsers
        run: node integrations/consumer-webkit-qa-wave6/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Run the complete 66-case simulation, retaining failures instead of skipping them
        if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
        run: npm run test:browser --prefix integrations/consumer-webkit-qa-wave6
      - name: Fail closed for missing/partial/blocked/failed browser evidence
        if: ${{ !cancelled() }}
        run: npm run gate --prefix integrations/consumer-webkit-qa-wave6
      - name: Run unchanged legacy Consumer UI and JSON-passport browser checks
        if: ${{ !cancelled() && steps.scope.outcome == 'success' && steps.browsers.outcome == 'success' }}
        env:
          UF_PLAYWRIGHT_MODULE: ${{ github.workspace }}/integrations/consumer-webkit-qa-wave6/node_modules/playwright/index.mjs
          UF_MISSION_QA_DIR: ${{ github.workspace }}/integrations/consumer-webkit-qa-wave6/artifacts/latest/legacy-consumer
        run: |
          set -euo pipefail
          npm run test:browser --prefix integrations/consumer-repair-mission-poc
          node integrations/consumer-repair-mission-poc/tests/passport-browser.mjs
      - name: Upload only local QA reports and own-UI screenshots, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consumer-wave6-browser-simulation-${{ github.event.pull_request.head.sha }}
          path: integrations/consumer-webkit-qa-wave6/artifacts/latest/
          if-no-files-found: error
          retention-days: 14
