name: "Integrated Work A+B+C verified v1.28.0"
on:
  push:
    branches: ["release/integrated-workers-v1280"]
    paths: ["integrations/integrated-v1280-request.md"]
permissions:
  contents: write
jobs:
  verify-combined:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore source checkpoint and reproduce original browser app
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/restore-source-checkpoint.py --target site
          test "$(node -p "require('./site/package.json').version")" = "1.27.1"
          npm ci --prefix integrations/auth-sdk --ignore-scripts
          node integrations/build-app.mjs
          mkdir -p baseline
          cp -a site baseline/site
      - name: Integrate Samsung first, then Bosch, and separately verified mobile UI
        shell: bash
        run: |
          set -euo pipefail
          node integrations/import-samsung-models-next.mjs --target site
          node integrations/import-bosch-models-next.mjs --target site
          cp -a baseline/site ui-standalone-site
          python3 integrations/ui-vacuum-detail-next/apply.py --target ui-standalone-site
          python3 integrations/integrate-work-v1280.py merge-ui
          python3 integrations/integrate-work-v1280.py checks
      - name: Bump only the coordinated release, rebuild and run full combined app tests
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/integrate-work-v1280.py bump
          node integrations/build-app.mjs
          python3 integrations/integrate-work-v1280.py sync
          node integrations/build-app.mjs
          node integrations/build-app.mjs --check
          (cd site && npm test && npm run check)
          python3 integrations/integrate-work-v1280.py checks
      - name: Verify checksum-controlled exact release patch and source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 integrations/package-site-patch.py --baseline baseline/site --site site --version 1.28.0 --description "Merged Samsung Bosch and mobile UI Work streams"
          python3 integrations/create-source-checkpoint.py --site site
          python3 integrations/restore-source-checkpoint.py --target /tmp/integrated-v1280-replay
          python3 integrations/integrate-work-v1280.py finish
          cat publish-info-v1.28.0.json
      - name: Commit only final checksummed source/patch archives and documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md integrations/source-checkpoint.json integrations/work-integration-v1280.json integrations/model-first-plan-v1270.md
          git add -f .demo/v1.28.0-patch/part-* .demo/source-v1.28.0/part-*
          if git diff --cached --name-only | grep -E '^site/|^\.github/workflows/'; then
            echo "Unsafe bundled site or workflow staged"; exit 1
          fi
          git commit -m "Package tested v1.28.0 Samsung Bosch and mobile UI combined release"
          git push origin HEAD:release/integrated-workers-v1280
