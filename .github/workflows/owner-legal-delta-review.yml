name: Owner legal source-lock delta review (no automatic reapproval)
on:
  push:
    branches: [integration/consumer-catalog-live-count-owner]
    paths:
      - '.github/workflows/owner-legal-delta-review.yml'
      - 'integrations/consumer-repair-mission-poc/app.mjs'
      - 'integrations/consumer-repair-mission-poc/offline-config.mjs'
      - 'integrations/consumer-repair-mission-poc/offline-worker.mjs'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract pinned source differences without altering the recorded evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, pathlib, json
          src=pathlib.Path('integrations/consumer-launch-preflight-wave6')
          sys.path.insert(0,str(src.resolve()))
          import preflight as p
          group,errors=p.sources(p.ROOT)
          inv=p.inventory(group)
          old=json.loads((src/'source-lock.json').read_text())
          assert errors==[],errors
          for key in ('checkpoint','consumer'):
            new_files=inv[key]['files']
            was=old.get(key,{})
            print(json.dumps({'sourceGroup':key,'newPaths':sorted(set(new_files)-set(was)),
              'removedPaths':sorted(set(was)-set(new_files)),
              'changed':[{'path':x,'previous':was[x],'current':new_files[x]} for x in sorted(set(new_files)&set(was)) if new_files[x]!=was[x]]},indent=2))
          for mode in p.MODES:
            report=p.evaluate(inv,errors,mode,{},old)
            print(json.dumps({'mode':mode,'overall':report['overall'],'launchApproved':report['launchApproved'],'sourceIdentity':next(c['status'] for c in report['checks'] if c['id']=='source-identity'),'unresolved':len(report['blockingChecks'])}))
            assert report['overall']=='BLOCKED' and not report['launchApproved'] and not report['commercialApproved']
          PY
      - name: Legacy source gate should still fail closed
        shell: bash
        run: |
          set +e
          python3 integrations/consumer-launch-preflight-wave6/preflight.py --json >/tmp/uf-preflight-no-secrets.json
          code=$?
          test "$code" -eq 2 || exit 1
          echo "Confirmed preflight blocked, launchApproved=false"
