<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6f8" />
  <meta name="description" content="Universal Fitment — Staubsauger von zehn Marken identifizieren und Ersatzteile, Filter, Preise und Geräteanleitungen anhand von Herstellerquellen finden." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="UF Staubsauger" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <script>
    try {
      const m=localStorage.getItem('uf_theme_v1')||'system';
      const d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme=d?'dark':'light';
      document.documentElement.dataset.themeMode=m;
      document.querySelector('meta[name="theme-color"]').setAttribute('content',d?'#090c11':'#f4f6f8');
    } catch {}
  </script>
  <link rel="stylesheet" href="./styles.css?v=1.26.8" />
  <title>Universal Fitment · Staubsauger & Ersatzteile</title>
</head>
<body>
  <noscript>Für Universal Fitment muss JavaScript aktiviert sein.</noscript>
  <div id="app" aria-live="polite"></div>
  <script type="module" src="./app-v1.26.8.js"></script>
</body>
</html>
